source:
  - changed-files:
      - any-glob-to-any-file: ["src/**"]
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**"]
data:
  - changed-files:
      - any-glob-to-any-file: ["data/**", "models/**", "records/**"]
site:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md"]
